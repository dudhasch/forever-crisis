version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups: { app: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: /extractor
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
